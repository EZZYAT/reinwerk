<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profil – ReinWerk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-blobs">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="home.html" class="logo">ReinWerk</a>
            <div class="nav-links">
                <a href="home.html">Home</a>
            </div>
        </div>
    </nav>

    <main class="container profile-page">

        <section class="profile-card glass" style="margin-bottom: 24px;">
            <div class="profile-left">
                <h1 id="userName">User</h1>
                <p id="userEmail">email@example.com</p>
                <p id="userPhone">+49 ...</p>
            </div>

            <div class="profile-right">
                <img id="userImage" class="profile-avatar" src="https://via.placeholder.com/160?text=User" alt="User">
            </div>
        </section>

        <section class="glass" style="padding: 24px; border-radius: 24px;">
            <h2 style="margin-bottom: 18px;">Meine Buchungen</h2>
            <div id="userBookings" class="dashboard-list"></div>
        </section>

    </main>

    <script>
        async function loadUserProfile() {
            try {
                const res = await fetch("/api/user/me");

                if (!res.ok) {
                    window.location.href = "login-user.html";
                    return;
                }

                const user = await res.json();

                document.getElementById("userName").textContent = user.name || "User";
                document.getElementById("userEmail").textContent = user.email || "";
                document.getElementById("userPhone").textContent = user.phone || "";
                document.getElementById("userImage").src =
                    user.image || "https://via.placeholder.com/160?text=User";

            } catch (err) {
                console.error("LOAD USER PROFILE ERROR:", err);
            }
        }

        async function loadUserBookings() {
            try {
                const res = await fetch("/api/user/bookings");

                if (!res.ok) return;

                const bookings = await res.json();
                const container = document.getElementById("userBookings");
                container.innerHTML = "";

                if (!bookings.length) {
                    container.innerHTML = `
                        <div class="dashboard-card">
                            <p>Noch keine Buchungen vorhanden.</p>
                        </div>
                    `;
                    return;
                }

                bookings.forEach((b) => {
                    const card = document.createElement("div");
                    card.className = "company-card";

                    card.innerHTML = `
                        <div class="company-info">
                            <h3>${b.companies?.name || "Firma"}</h3>

                            <div class="company-meta">
                                <div>📅 ${b.booking_date || "-"}</div>
                                <div>⏰ ${b.booking_time || "-"}</div>
                                <div>🧹 ${b.service || "-"}</div>
                                <div>📍 ${b.companies?.district || "-"}</div>
                                <div>📌 ${b.status || "pending"}</div>
                            </div>

                            <div class="company-actions">
                                <a class="btn btn-primary" href="profile.html?id=${b.company_id}">
                                    Firma ansehen
                                </a>
                            </div>
                        </div>

                        <img class="company-thumb"
                             src="${b.companies?.image || 'https://via.placeholder.com/400x250?text=Firma'}"
                             alt="${b.companies?.name || 'Firma'}">
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("LOAD USER BOOKINGS ERROR:", err);
            }
        }

        loadUserProfile();
        loadUserBookings();
    </script>

</body>
</html>
