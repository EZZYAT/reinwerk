<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma registrieren – ReinWerk</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container form-page">

<h1>Firma registrieren</h1>

<form id="registerForm" class="form-card">

<input id="name" type="text" placeholder="Firmenname" required>

<input id="email" type="email" placeholder="Email" required>

<input id="password" type="password" placeholder="Passwort" required>

<input id="phone" type="tel" placeholder="Telefon">

<input id="district" type="text" placeholder="Bezirk">

<button class="btn btn-primary">Firma registrieren</button>

<p id="msg"></p>

</form>

<a href="home.html">← Zurück</a>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", async (e)=>{

e.preventDefault();

const payload={
name:document.getElementById("name").value.trim(),
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value.trim(),
phone:document.getElementById("phone").value.trim(),
district:document.getElementById("district").value.trim()
};

const msg=document.getElementById("msg");

const res=await fetch("https://reinwerk.onrender.com/api/register-company",{

method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)

});

const data=await res.json();

if(!res.ok){
msg.textContent="❌ "+(data.message || "Register failed");
return;
}

msg.textContent="✅ Account created";

setTimeout(()=>{
window.location.href="home.html";
},1000);

});

</script>

</body>
</html>
