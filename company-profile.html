<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Profile - ReinWerk</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container" style="padding-top:24px">
        <div class="page-card glass company-profile-layout">
            <div class="company-profile-form-side">
                <h1>Company Profile</h1>
                <p>Update your company information.</p>

                <form id="profileForm" class="auth-form">
                    <label>Name</label>
                    <input id="name" type="text" required />

                    <label>District</label>
                    <input id="district" type="text" required />

                    <label>Email</label>
                    <input id="email" type="email" required />

                    <label>Phone</label>
                    <input id="phone" type="text" required />

                    <label>Price</label>
                    <input id="price" type="text" required />

                    <label>Team Size</label>
                    <input id="teamSize" type="number" min="1" required />

                    <label>Languages</label>
                    <input id="languages" type="text" placeholder="DE, AR, EN" />

                    <label>Services</label>
                    <input id="services" type="text" placeholder="Wohnung, Büro, Fenster" />

                    <label>Description</label>
                    <textarea id="description" rows="5"></textarea>

                    <div class="company-profile-image-side">
                        <div class="profile-image-box">
                            <img id="profilePreview" src="" class="company-profile-preview" alt="company image"
                                style="display:none;" />
                        </div>

                        <div class="form-grid" style="margin-top:16px">
                            <div>
                                <label>Upload Image from Computer</label>
                                <input id="imageFile" type="file" accept="image/*" />
                                <small class="field-help">Choose an image from your computer.</small>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="company.html" class="btn">Back</a>
                    </div>

                    <p id="msg" class="auth-msg"></p>
                </form>

                <div style="display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;">
                    <button id="logoutBtn" class="btn">Logout</button>
                    <button id="deleteAccountBtn" class="btn btn-danger" type="button">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let company = null;

        async function loadMe() {
            const res = await fetch("/api/company/me");

            if (!res.ok) {
                window.location.href = "login.html";
                return;
            }

            company = await res.json();

            document.getElementById("name").value = company.name || "";
            document.getElementById("district").value = company.district || "";
            document.getElementById("email").value = company.email || "";
            document.getElementById("phone").value = company.phone || "";
            document.getElementById("price").value = company.price || "";
            document.getElementById("teamSize").value = company.teamSize || 1;
            document.getElementById("languages").value = (company.languages || []).join(", ");
            document.getElementById("services").value = (company.services || []).join(", ");
            document.getElementById("description").value = company.description || "";

            const preview = document.getElementById("profilePreview");
            if (company.image) {
                preview.src = company.image;
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        }

        document.getElementById("imageFile").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const preview = document.getElementById("profilePreview");
                preview.src = event.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById("profilePreview").addEventListener("error", () => {
            document.getElementById("profilePreview").src = "";
            document.getElementById("profilePreview").style.display = "none";
        });

        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const msg = document.getElementById("msg");
            msg.textContent = "Saving...";
            msg.className = "auth-msg";

            let imageValue = company?.image || "";

            try {
                const fileInput = document.getElementById("imageFile");
                if (fileInput && fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("image", fileInput.files[0]);

                    const uploadRes = await fetch("/api/upload", {
                        method: "POST",
                        body: formData
                    });

                    const uploadData = await uploadRes.json();

                    if (!uploadRes.ok) {
                        msg.textContent = "❌ " + (uploadData.message || "Image upload failed");
                        msg.className = "auth-msg error";
                        return;
                    }

                    if (uploadData.image) {
                        imageValue = uploadData.image;
                    }
                }

                const payload = {
                    name: document.getElementById("name").value.trim(),
                    district: document.getElementById("district").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    price: document.getElementById("price").value.trim(),
                    teamSize: Number(document.getElementById("teamSize").value || 1),
                    languages: document.getElementById("languages").value
                        .split(",")
                        .map(v => v.trim())
                        .filter(Boolean),
                    services: document.getElementById("services").value
                        .split(",")
                        .map(v => v.trim())
                        .filter(Boolean),
                    description: document.getElementById("description").value.trim(),
                    image: imageValue
                };

                const res = await fetch("/api/company/profile", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    msg.textContent = "❌ " + (data.message || "Update failed");
                    msg.className = "auth-msg error";
                    return;
                }

                msg.textContent = "✅ Profile updated successfully";
                msg.className = "auth-msg success";

                company = data.company || { ...company, ...payload };

                const preview = document.getElementById("profilePreview");
                if (payload.image) {
                    preview.src = payload.image;
                    preview.style.display = "block";
                } else {
                    preview.src = "";
                    preview.style.display = "none";
                }
            } catch (err) {
                console.error(err);
                msg.textContent = "❌ Update failed";
                msg.className = "auth-msg error";
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await fetch("/api/logout", { method: "POST" });
            window.location.href = "login.html";
        });

        document.getElementById("deleteAccountBtn").addEventListener("click", async () => {
            if (!confirm("Delete your account permanently?")) return;

            const res = await fetch("/api/company/account", {
                method: "DELETE"
            });

            if (!res.ok) {
                alert("Delete failed");
                return;
            }

            window.location.href = "login.html";
        });

        loadMe();
    </script>
</body>

</html>
