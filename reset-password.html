<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wave-bg">
        <div class="wave one"></div>
        <div class="wave two"></div>
        <div class="wave three"></div>
    </div>

    <div class="container" style="max-width:500px; margin:40px auto;">
        <div class="booking-card" style="padding:20px;">
            <h1>Reset Password</h1>

            <form id="resetForm">
                <label>Email</label>
                <input id="email" type="email" required placeholder="Enter company email"
                    style="width:100%; padding:10px; margin:10px 0;">

                <label>New Password</label>
                <input id="newPassword" type="password" required placeholder="Enter new password"
                    style="width:100%; padding:10px; margin:10px 0;">

                <label>Confirm Password</label>
                <input id="confirmPassword" type="password" required placeholder="Repeat new password"
                    style="width:100%; padding:10px; margin:10px 0;">

                <button type="submit">Save New Password</button>
                <br>
                <a href="login.html" style="display:inline-block; margin-top:10px;">Back to Login</a>

                <p id="msg"></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const msg = document.getElementById("msg");

            if (newPassword !== confirmPassword) {
                msg.textContent = "❌ Passwords do not match";
                return;
            }

            const res = await fetch("/api/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, newPassword })
            });

            const data = await res.json();

            if (!res.ok) {
                msg.textContent = "❌ " + (data.message || "Reset failed");
                return;
            }

            msg.textContent = "✅ Password updated";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1000);
        });
    </script>

</body>

</html>
