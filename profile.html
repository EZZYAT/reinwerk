<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil – ReinWerk</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="wave-bg">
        <div class="wave one"></div>
        <div class="wave two"></div>
        <div class="wave three"></div>
    </div>

    <div class="container profile-page">

        <a href="index.html" class="back-link">← Zurück</a>

        <!-- Company Profile Card -->
        <section class="profile-card glass" id="profileBox">
            <div class="profile-left">
                <h1 id="pName">Firmenname</h1>
                <p id="pAbout" class="profile-description">Beschreibung der Firma</p>

                <div class="profile-meta">
                    <p><strong>Bezirk:</strong> <span id="pDistrict"></span></p>
                    <p><strong>Typ:</strong> <span id="pType"></span></p>
                    <p><strong>Teamgröße:</strong> <span id="pTeam"></span></p>
                    <p><strong>Preis:</strong> <span id="pPrice"></span></p>
                    <p><strong>Bewertung:</strong> ⭐ <span id="pRating"></span></p>
                    <p><strong>Erfahrung:</strong> <span id="pExperience"></span></p>
                    <p><strong>Verfügbarkeit:</strong> <span id="pAvailability"></span></p>
                    <p><strong>Kontakt:</strong> <span id="pPhone"></span></p>
                    <p><strong>Sprachen:</strong> <span id="pLang"></span></p>
                </div>

                <div class="profile-services">
                    <h3>Services</h3>
                    <ul id="pServices"></ul>
                </div>

                <div class="profile-actions">
                    <a id="pCall" class="btn btn-primary" href="#">Anrufen</a>
                </div>
            </div>

            <div class="profile-right">
                <img id="pImage" class="profile-avatar" src="" alt="Company image"/>
            </div>
        </section>

        <!-- Booking Card -->
        <section class="booking-box glass">
            <h2>Jetzt buchen</h2>

            <form id="bookingForm" class="booking-form-grid">
                <div>
                    <label for="bDate">Datum</label>
                    <input id="bDate" type="date" required />
                </div>

                <div>
                    <label for="bTime">Uhrzeit</label>
                    <input id="bTime" type="time" required />
                </div>

                <div class="full-width">
                    <label for="bAddress">Adresse</label>
                    <input id="bAddress" type="text" placeholder="Straße, Nr, PLZ" required />
                </div>

                <div class="full-width">
                    <label for="bNote">Notiz</label>
                    <textarea id="bNote" rows="4" placeholder="z.B. Größe der Wohnung, Wünsche..."></textarea>
                </div>

                <div class="full-width booking-actions">
                    <button type="submit" class="btn btn-primary">Anfrage senden</button>
                    <p id="bookingMsg"></p>
                </div>
            </form>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
