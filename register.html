<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – ReinWerk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Konto erstellen</h1>

    <form id="registerForm" class="glass" style="padding:20px;border-radius:20px;">

        <!-- BASIC -->
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <input type="text" id="phone" placeholder="Telefon">

        <!-- TYPE -->
        <label><strong>Account Type</strong></label>
        <select id="accountType">
            <option value="personal">Kunde</option>
            <option value="company">Firma</option>
        </select>

        <!-- COMPANY ONLY -->
        <div id="companyFields" style="display:none; margin-top:10px;">
            <input type="text" id="district" placeholder="Bezirk">
            <input type="text" id="price" placeholder="Preis">
            <input type="number" id="teamSize" placeholder="Teamgröße">
            <input type="text" id="services" placeholder="Services (comma)">
            <textarea id="description" placeholder="Beschreibung"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">Registrieren</button>

    </form>

</main>

<script>

const accountType = document.getElementById("accountType");
const companyFields = document.getElementById("companyFields");

accountType.addEventListener("change", () => {
    if (accountType.value === "company") {
        companyFields.style.display = "block";
    } else {
        companyFields.style.display = "none";
    }
});

document.getElementById("registerForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const type = accountType.value;

    if (type === "personal") {

        const res = await fetch("/api/register-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name.value,
                email: email.value,
                password: password.value,
                phone: phone.value
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message);
            return;
        }

        window.location.href = "login.html";

    } else {

        const res = await fetch("/api/register-company", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name.value,
                email: email.value,
                password: password.value,
                phone: phone.value,
                district: district.value,
                price: price.value,
                teamSize: teamSize.value,
                services: services.value,
                description: description.value
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message);
            return;
        }

        window.location.href = "login.html";
    }

});

</script>

</body>
</html>
